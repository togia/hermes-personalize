name: Keep draw.io export synchronized

on:
  push:
    branches:
      - main
    paths:
      - "**.drawio"
      - .github/workflows/drawio-export.yml

permissions:
  contents: write

concurrency:
  group: drawio-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drawio-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export draw.io files to SVG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs
          output: export
          format: svg
          remove-page-suffix: true
          action-mode: all

      - name: Bust README image cache
        run: |
          token="${{ github.run_id }}-${{ github.run_number }}"
          sed -i -E "s#(!\[Infrastructure diagram\]\(\./docs/export/infra\.svg)(\?[^)]*)?\)#\1?v=${token})#" README.md

      - name: Commit and push generated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Chore: Export draw.io to svg via CI/CD"
          file_pattern: "docs/export/*.svg README.md"
